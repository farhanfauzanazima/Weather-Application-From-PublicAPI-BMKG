<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prakiraan Cuaca BMKG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">

    <div class="header-section text-center mb-5">
      <div class="bmkg-logo mb-3">🌤️</div>
      <h1 class="app-title">Prakiraan Cuaca BMKG</h1>
      <p class="app-subtitle">Data resmi Badan Meteorologi, Klimatologi, dan Geofisika</p>
    </div>

    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <div class="search-card p-4">

          <div class="mb-3">
            <label class="form-label">🗺️ Provinsi</label>
            <select id="selProvinsi" class="form-select" onchange="onProvinsiChange()">
              <option value="">-- Pilih Provinsi --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">🏙️ Kabupaten / Kota</label>
            <select id="selKabupaten" class="form-select" onchange="onKabupatenChange()" disabled>
              <option value="">-- Pilih Kabupaten/Kota --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">🏘️ Kecamatan</label>
            <select id="selKecamatan" class="form-select" onchange="onKecamatanChange()" disabled>
              <option value="">-- Pilih Kecamatan --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">🏡 Desa / Kelurahan</label>
            <select id="selDesa" class="form-select" disabled>
              <option value="">-- Pilih Desa/Kelurahan --</option>
            </select>
          </div>

          <button class="btn btn-cari w-100" onclick="lihatCuaca()">
            🔍 Lihat Cuaca
          </button>

          <!-- Loading indicator dropdown -->
          <div id="dropdownLoading" class="dropdown-loading" style="display:none;">
            <div class="spinner-border spinner-border-sm me-2"></div>
            <span id="dropdownLoadingText">Memuat data...</span>
          </div>

        </div>
      </div>
    </div>

    <!-- Info Lokasi -->
    <div id="infoLokasi" class="row justify-content-center mb-4" style="display:none;">
      <div class="col-md-8">
        <div class="lokasi-card p-3">
          <div class="row align-items-center">
            <div class="col">
              <div class="lokasi-label">📍 Lokasi</div>
              <div class="lokasi-nama" id="namaLokasi">-</div>
            </div>
            <div class="col-auto">
              <div class="koordinat" id="koordinat">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Hasil cuaca -->
    <div id="hasil"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
